openapi: 3.0.0
info:
  title: Credential registry query API
  description: |
    Read-only HTTP API for querying the credential records stored in a credential registry.
    Registries SHOULD implement this API.
    It covers registry info, credential lookup, and bulk credential retrieval.
    The schema of credential records is defined by the Daml package splice-api-credential-record-v1.
    Publishing credential records is covered by the separate, optional credential registry publication API.
  version: 1.0.0
paths:

  /registry/credential-query/v1/info:
    get:
      operationId: "getCredentialRegistryInfo"
      description: |
        Get information about the credential registry.
        Useful to discover the admin party and the supported versions of the credential registry standard.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GetCredentialRegistryInfoResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/credentials:
    post:
      operationId: "listCredentials"
      description: |
        List the credential records matching the provided filters.

        property is required. issuer, holder, and subject are optional and must be set in that order. A later filter without the earlier ones is rejected with 400.

        synchronizerTimes is optional. When set, only credentials assigned to the listed synchronizers are returned, each evaluated as of its own recordTime. When omitted, the registry evaluates at its own most recently processed record times. The response always echoes the synchronizerTimes the result was computed at. A recordTime older than limits.minQueryAgeSeconds is rejected with 400. A recordTime the registry has not yet processed MAY also be rejected with 400; clients SHOULD only pass synchronizerTimes to a registry backend that has reported having reached them.

        Results are ordered by synchronizerId ascending, then recordTime descending, then contractId ascending; recordTime is only comparable within the same synchronizer. The operation MAY return records whose expiresAt is in the past. Clients ignore expiresAt when choosing a record and use validFrom and validUntil. Two records are duplicates when they have the same issuer and holder and both contain a claim with the same subject and property; registries SHOULD NOT create such duplicates across synchronizers, since last-write-wins is only defined within a synchronizer. When property, issuer, holder, and subject are set and effectiveOnly is true, the first returned record per synchronizer is the last-write-wins record. Otherwise the client takes, in each group of duplicates, the first returned record whose validity period is effective.

        Note that registries MAY decide to limit the number of records returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCredentialsRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/credentials/snapshot:
    post:
      operationId: "listCredentialsSnapshot"
      description: |
        List all credential records currently active in the registry, regardless of property. Used by clients that maintain a full copy of the registry: fetch a snapshot, then continue reading /registry/credential-query/v1/events from the synchronizerTimes it was computed at.

        synchronizerTimes is optional, with the same meaning as in listCredentials. The response always echoes the synchronizerTimes the result was computed at. A recordTime older than limits.minQueryAgeSeconds is rejected with 400; a recordTime the registry has not yet processed MAY also be rejected with 400.

        Results are ordered by contractId ascending. after is the contractId of the last credential record received in a previous response; omit to start from the beginning. The response's next, if present, is the value to pass as after to continue; continuing with the same synchronizerTimes remains valid for limits.eventRetentionDays, even once that time has fallen outside limits.minQueryAgeSeconds.

        Note that registries MAY decide to limit the number of records returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListCredentialsSnapshotRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCredentialsSnapshotResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/credentials/lookup:
    post:
      operationId: "lookupCredential"
      description: |
        Look up a single credential record by contractId, without knowing in advance which synchronizer it is assigned to.

        synchronizerTimes is optional and has a different meaning than in listCredentials: it is not a filter on which synchronizers to consider, since the caller does not know which one the contract is on. If the contract's synchronizer is listed, the lookup is evaluated as of that recordTime; otherwise the registry evaluates at its own most recently processed record time for it. The response always echoes the synchronizerTimes the result was computed at. A recordTime older than limits.minQueryAgeSeconds is rejected with 400; a recordTime the registry has not yet processed MAY also be rejected with 400.

        If the contractId is unknown to the registry, or was archived longer ago than limits.eventRetentionDays, this responds with 404. Otherwise status is active or archived; a contract being reassigned between synchronizers remains active for this purpose. When active, credential carries the current CredentialView and, if requested, a DisclosedContract. When archived, credential is omitted and archivedAt is the recordTime at which the archive was observed; a DisclosedContract cannot be provided for an archived contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupCredentialRequest"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupCredentialResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/synchronizers:
    get:
      operationId: "listCredentialSynchronizers"
      description: |
        Synchronizers on which this registry stores credential records, together with the most recently known record time on each. recordTime is the latest time this registry has fully processed on that synchronizer, not the record time of the last credential record change.
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialSynchronizersResponse"
        "404":
          $ref: "#/components/responses/404"

  /registry/credential-query/v1/events:
    get:
      operationId: "listCredentialEvents"
      description: |
        Create and archive events for one synchronizer. Ordered by recordTime ascending, then contractId ascending; events sharing both are never split across a page boundary.

        A reassignment of a credential contract to another synchronizer is served as an archive event on the source synchronizer and a create event on the target synchronizer.

        afterRecordTime and afterContractId are the recordTime and contractId of the last event a client has processed; set both to continue, also after a restart, or omit both to start from the beginning. Setting only one of the two is rejected with 400. A response without events means that the client has caught up and should retry later with the same afterRecordTime/afterContractId.

        The registry MAY prune the events of records whose archive event is older than the retention window advertised by the Info API in limits.eventRetentionDays. If it pruned events after afterRecordTime/afterContractId, it responds with 400 instead of skipping them; the client then restarts from a snapshot (/registry/credential-query/v1/credentials/snapshot) instead of from the beginning. A client that has caught up and resumes within that window is never rejected.
      parameters:
        - in: query
          name: synchronizerId
          schema:
            type: string
          required: true
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
          required: false
        - in: query
          name: afterRecordTime
          schema:
            type: string
            format: date-time
          required: false
        - in: query
          name: afterContractId
          schema:
            type: string
          required: false
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ListCredentialEventsResponse"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"

components:
  responses:
    "400":
      description: "bad request"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    "404":
      description: "not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GetCredentialRegistryInfoResponse:
      type: object
      properties:
        adminId:
          description: "The Daml party of the credential registry administrator"
          type: string
        supportedVersions:
          description: "The versions of the credential registry standard supported by this registry"
          type: array
          items:
            type: integer
            format: int32
        limits:
          $ref: "#/components/schemas/CredentialRegistryLimits"
      required:
        - adminId
        - supportedVersions
        - limits

    CredentialRegistryLimits:
      type: object
      description: "The limits of the credential registry"
      properties:
        maxPageSize:
          description: "The maximum page size supported by the registry for listing credential records"
          type: integer
          format: int32
        maxNumClaims:
          description: |
            The maximum number of claims allowed in new credential records.
            There is no limit on the number of claims when querying existing records.
          type: integer
          format: int32
        maxPropertyLength:
          description: |
            The maximum length of a property allowed in new credential records.
            There is no limit on the property length when querying existing records.
          type: integer
          format: int32
        maxSubjectLength:
          description: |
            The maximum length of the subject field allowed in new credential records.
            There is no limit on the subject field length when querying existing records.
          type: integer
          format: int32
        maxValueLength:
          description: |
            The maximum length of a claim value allowed in new credential records.
            There is no limit on the claim value length when querying existing records.
          type: integer
          format: int32
        eventRetentionDays:
          description: |
            How many days the registry retains events of archived credential records.
            Events whose archive is older than this window MAY be pruned. This also bounds how long a
            snapshot (see /registry/credential-query/v1/credentials/snapshot) MAY be continued with the
            same synchronizerTimes, and how long an archived credential remains discoverable via the
            lookup endpoint.
          type: integer
          format: int32
        minQueryAgeSeconds:
          description: |
            How many seconds in the past a recordTime in synchronizerTimes MAY be, when starting a query via listCredentials, the snapshot endpoint, or the lookup endpoint. MUST be at least 600.
          type: integer
          format: int32
      required:
        - maxPageSize
        - maxNumClaims
        - maxPropertyLength
        - maxSubjectLength
        - maxValueLength
        - eventRetentionDays
        - minQueryAgeSeconds

    SynchronizerTime:
      type: object
      description: |
        A synchronizer id paired with a record time on that synchronizer.
        Record times of different synchronizers are not comparable to each other.
      properties:
        synchronizerId:
          type: string
          description: "The id of the synchronizer."
        recordTime:
          type: string
          format: date-time
          description: |
            A record time on that synchronizer.
      required:
        - synchronizerId
        - recordTime

    ListCredentialsRequest:
      type: object
      description: "The request for listing credential records."
      properties:
        property:
          type: string
          description: |
            Only return credential records that contain at least one claim with this property.
            The value matches the whole property, not a prefix.
        issuer:
          type: string
          description: |
            Only return credential records issued by the specified party.
            Requires property.
        holder:
          type: string
          description: |
            Only return credential records held by the specified party.
            Requires property and issuer.
        subject:
          type: string
          description: |
            Only return credential records that contain a claim with this subject.
            Requires property, issuer, and holder.
            A claim matches when its subject equals this value, or when its subject is unset and this value is the textual party id of the holder.
        effectiveOnly:
          type: boolean
          default: false
          description: |
            If true, return only records whose validity period covers the time the query is served.
            validFrom, if set, is at or before that time. validUntil, if set, is after it.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate the query as of these synchronizer times instead of the registry's own most recently processed times.

            MUST originate from a prior response of this endpoint, of the snapshot endpoint, or of /registry/credential-query/v1/synchronizers; an arbitrary combination of times is not guaranteed to be a consistent view of the registry.
        limit:
          type: integer
          format: int32
          description: |
            The maximum number of credential records to return.
        pageToken:
          type: string
          description: |
            The page token to continue retrieving results from a previous list request.
            Ensure that the other filter parameters are identical to the previous request.
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.
      required:
        - property

    ListCredentialsResponse:
      type: object
      description: "The response for listing credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The list of credential records matching the provided filters.
        nextPageToken:
          type: string
          description: |
            The token for the next page of results. Omitted if there are no more results.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - synchronizerTimes

    ListCredentialsSnapshotRequest:
      type: object
      description: "The request for listing a snapshot of all active credential records."
      properties:
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate the query as of these synchronizer times instead of the registry's own most recently processed times.

            MUST originate from a prior response of this endpoint, of listCredentials, or of /registry/credential-query/v1/synchronizers; an arbitrary combination of times is not guaranteed to be a consistent view of the registry.
        after:
          type: string
          description: |
            The contractId of the last credential record received in a previous response. Omit to start from the beginning.
        limit:
          type: integer
          format: int32
          description: |
            The maximum number of credential records to return.
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contracts of the credentials
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contracts will not include debug fields.

    ListCredentialsSnapshotResponse:
      type: object
      description: "The response for listing a snapshot of all active credential records."
      properties:
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
          description: |
            The credential records in this page of the snapshot.
        next:
          type: string
          description: |
            Pass as after to continue. Omitted if there are no more results.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - synchronizerTimes

    LookupCredentialRequest:
      type: object
      description: "The request for looking up a single credential record by contractId."
      properties:
        contractId:
          type: string
          description: |
            The contract id of the credential record to look up.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            Evaluate the lookup as of these synchronizer times instead of the registry's own most recently processed times, for whichever synchronizer the contract turns out to be assigned to.

            MUST originate from a prior response of this endpoint, of listCredentials, of the snapshot endpoint, or of /registry/credential-query/v1/synchronizers; an arbitrary combination of times is not guaranteed to be a consistent view of the registry.
        includeDisclosedContracts:
          type: boolean
          default: false
          description: |
            If set to true, the response will include the disclosed contract of the credential
            for use with explicit contract disclosure upon command submission.
        excludeDebugFields:
          type: boolean
          default: false
          description: |
            If set to true, then the disclosed contract will not include debug fields.
      required:
        - contractId

    LookupCredentialResponse:
      type: object
      description: "The response for looking up a single credential record by contractId."
      properties:
        status:
          type: string
          enum:
            - active
            - archived
        credential:
          $ref: "#/components/schemas/Credential"
          description: Present when status is active.
        archivedAt:
          type: string
          format: date-time
          description: Present when status is archived. The recordTime at which the archive was observed.
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
          description: |
            The synchronizer times the result was computed at.
      required:
        - status
        - synchronizerTimes

    ListCredentialSynchronizersResponse:
      type: object
      properties:
        synchronizerTimes:
          type: array
          items:
            $ref: "#/components/schemas/SynchronizerTime"
      required:
        - synchronizerTimes

    CredentialEvent:
      type: object
      properties:
        eventType:
          type: string
          enum:
            - create
            - archive
        recordTime:
          type: string
          format: date-time
        contractId:
          type: string
        credentialView:
          type: object
          description: Present when eventType is create. Schema of Splice.Api.Credential.RecordV1.CredentialView.
      required:
        - eventType
        - recordTime
        - contractId

    ListCredentialEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/CredentialEvent"
      required:
        - events

    Credential:
      type: object
      description: |
        A credential record stored in the registry.
      properties:
        contractId:
          type: string
          description: The contract id of the credential record.
        recordTime:
          type: string
          format: date-time
          description: |
            Sequencing time of the confirmation request that created this credential contract.
            Not CredentialView.createdAt.
        credentialView:
          type: object
          description: |
            The view computed for the credential with the schema of Splice.Api.Credential.RecordV1.CredentialView.
        disclosedContract:
          $ref: "#/components/schemas/DisclosedContract"
          description: |
            The disclosed contract information for verifying the credential record using explicit contract disclosure.
      required:
        [
          "contractId",
          "recordTime",
          "credentialView",
        ]

    DisclosedContract:
      type: object
      description: |
        A contract that is disclosed for use with explicit contract disclosure
        when preparing transactions on validator nodes that do not know this contract.
      properties:
        templateId:
          type: string
          description: "The template ID of the disclosed contract."
        contractId:
          type: string
          description: "The contract ID of the disclosed contract."
        createdEventBlob:
          type: string
          description: |
            The binary-encoded created event of the disclosed contract.
            This blob can be used to prepare transactions on validator
            nodes that do not know this contract. This is done using
            explicit contract disclosure, where the created event is
            provided alongside the command that refers to the contract.
        synchronizerId:
          description: |
            The synchronizer to which the contract is currently assigned.
            If the contract is in the process of being reassigned, then a "409" response is returned.
          type: string
        debugPackageName:
          description: |
            The name of the Daml package that was used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: string
        debugPayload:
          description: |
            The contract arguments that were used to create the contract.
            Use this data only if you trust the provider, as it might not match the data in the
            `createdEventBlob`.
          type: object
        debugCreatedAt:
          description: |
            The ledger effective time at which the contract was created.
            Use this data only if you trust the provider, as it might not match the data in the
            `disclosedContract`.
          type: string
          format: date-time
      required:
        [
          "templateId",
          "contractId",
          "createdEventBlob",
          "synchronizerId"
        ]

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
